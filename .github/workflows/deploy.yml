name: Remove published game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  remove:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Create empty deployment
        run: |
          mkdir empty-site
          printf '<!doctype html><html><head><title>404</title></head><body>404</body></html>' > empty-site/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: empty-site
      - uses: actions/deploy-pages@v4

name: Deploy Neon Coast
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: TURN_ICE_SERVERS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_ICE_SERVERS: ${{ secrets.TURN_ICE_SERVERS }}
      - name: Share production client with browser test jobs
        uses: actions/upload-artifact@v4
        with:
          name: neon-client-dist
          path: dist/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  browser-tests:
    name: Browser tests (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - group: core
            specs: tests/browser.spec.ts tests/expanded-world.browser.spec.ts tests/city-design.browser.spec.ts tests/graphics.browser.spec.ts tests/realism.browser.spec.ts tests/mobility.browser.spec.ts tests/career.browser.spec.ts
          - group: city
            specs: tests/casino.browser.spec.ts tests/stories.browser.spec.ts tests/tournament.browser.spec.ts
          - group: multiplayer
            specs: tests/multiplayer.browser.spec.ts
          - group: activities
            specs: tests/expansion.browser.spec.ts tests/garage-building.browser.spec.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: neon-client-dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Run browser test group
        run: npm run test:e2e -- ${{ matrix.specs }}
      - name: Failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics-${{ matrix.group }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
  deploy:
    needs: [build, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
